# Deploys every push to main to a Hugging Face Docker Space, so the deployment history is recorded.
# Needs repository secret HF_TOKEN (write token) and repository variable HF_SPACE (e.g. "user/parkspot").
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move binaries to Git LFS (required by Hugging Face), CI copy only
        run: |
          git config user.email "ci@parkspot" && git config user.name "ci"
          git lfs install
          git lfs migrate import --everything --include="*.pt,*.mp4,*.jpg,*.png" --yes
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
