# Smoke test of the deployed site (Actions -> smoke -> Run workflow). Waits until the site runs the
# commit being tested, then runs backend/scripts/smoke.py: pages, photo analysis, and the real-lot
# flow on a private test lot (PIN, privacy, no data before the first picture, booking, payment).
name: smoke
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployed site URL"
        default: "https://parkspot-5bo4.onrender.com"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the site runs this commit (free tier sleeps, deploys take minutes)
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            body=$(curl -s -m 30 "${{ inputs.url }}/api/health" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q "\"commit\":\"$want\"" && exit 0
            sleep 15
          done; echo "site never reported commit $want"; exit 1
      - name: Check pages, analysis and the real-lot flow
        run: python3 backend/scripts/smoke.py "${{ inputs.url }}"
