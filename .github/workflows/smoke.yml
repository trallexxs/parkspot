# Smoke test of the deployed site (Actions -> smoke -> Run workflow). Waits until the site runs the
# commit being tested, then checks pages, the live camera, photo analysis and the booking flow.
name: smoke
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployed site URL"
        default: "https://parkspot-5bo4.onrender.com"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the site runs this commit (free tier sleeps, deploys take minutes)
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            body=$(curl -s -m 30 "${{ inputs.url }}/api/health" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q "\"commit\":\"$want\"" && exit 0
            sleep 15
          done; echo "site never reported commit $want"; exit 1
      - name: Check pages and API
        run: |
          set -e
          U="${{ inputs.url }}"
          echo "== health";  curl -sf "$U/api/health"; echo
          echo "== home page"; curl -sf "$U/" | grep -o "<title>.*</title>"
          echo "== SPA route"; curl -sf "$U/lot/demo" | grep -o "<title>.*</title>"
          echo "== lots";    curl -sf "$U/api/lots"; echo
          sleep 8
          echo "== demo lot state"; curl -sf "$U/api/lots/demo/state" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['counts'], 'frames', d['camera']['frames_processed'], d['camera']['timing'])"
          echo "== camera frame"; curl -sf -o frame.jpg -w "%{http_code} %{size_download} bytes\n" "$U/api/lots/demo/frame.jpg"
          echo "== analyze sample photo (640x360)"; curl -sf -w "  wall time %{time_total}s\n" -F image=@data/demo/sample_frame.jpg "$U/api/analyze" -o a1.json; python3 -c "import json;d=json.load(open('a1.json'));print(d['summary'], d['layout'], d['timing'])"
          echo "== analyze phone-size photo (4000x2250)"
          pip install --quiet pillow
          python3 -c "from PIL import Image;Image.open('data/demo/sample_frame.jpg').resize((4000,2250)).save('phone.jpg',quality=92)"
          curl -sf -w "  wall time %{time_total}s (upload incl.)\n" -F image=@phone.jpg "$U/api/analyze" -o a2.json; python3 -c "import json;d=json.load(open('a2.json'));print(d['summary'], d['detector'], d['timing'])"
          echo "== booking flow"
          FREE=$(curl -sf "$U/api/lots/demo/state" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(k for k,v in d['statuses'].items() if v=='free'))")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BID=$(curl -sf -XPOST "$U/api/lots/demo/bookings" -H 'content-type: application/json' -d "{\"spot_id\":\"$FREE\",\"arrive_at\":\"$NOW\",\"duration_min\":60}" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sf -XPOST "$U/api/bookings/$BID/pay" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['spot_id'], d['status'], d['directions']['steps'][-1]['text'])"
          curl -sf -XPOST "$U/api/bookings/$BID/cancel" | python3 -c "import sys,json;print('cleanup:', json.load(sys.stdin)['status'])"
          echo "ALL CHECKS PASSED"
